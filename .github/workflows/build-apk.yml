name: Build Native APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify AndroidX and Kotlin/Java JVM configuration
        run: |
          echo "android.useAndroidX=true" >> "$GITHUB_WORKSPACE/gradle.properties"
          echo "android.enableJetifier=true" >> "$GITHUB_WORKSPACE/gradle.properties"
          echo "--- gradle.properties ---"
          cat "$GITHUB_WORKSPACE/gradle.properties"
      - name: Repair MainActivity structure if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          marker = "\nprivate fun android.graphics.Bitmap.pngBytes()"
          if marker in s:
              before, after = s.split(marker, 1)
              if before.count("{") > before.count("}"):
                  s = before + "}\n" + marker.lstrip("\n") + after
                  p.write_text(s, encoding="utf-8")
                  print("Repaired missing closing brace before pngBytes().")
              else:
                  print("MainActivity brace structure already balanced before pngBytes().")
          else:
              print("pngBytes marker not found; no source mutation performed.")
          PY
          git diff -- app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt
          if ! git diff --quiet -- app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt
            git commit -m "Repair MainActivity closing brace [skip ci]"
            git push
          fi
      - name: Verify Kotlin source
        run: |
          test -f app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt
          grep -q "class MainActivity" app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt
          grep -q "fun AziziApp" app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt
          grep -q "fun InvoiceScreen" app/src/main/java/com/azizi/pos/nativeapp/MainActivity.kt
          echo "MainActivity.kt structure verified"
      - name: Build debug APK
        run: gradle --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xttmbmm77sa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
