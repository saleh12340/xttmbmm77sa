name: Build Native APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify AndroidX configuration
        run: |
          echo "android.useAndroidX=true" >> "$GITHUB_WORKSPACE/gradle.properties"
          echo "android.enableJetifier=true" >> "$GITHUB_WORKSPACE/gradle.properties"
          echo "--- gradle.properties ---"
          cat "$GITHUB_WORKSPACE/gradle.properties"
      - name: Build debug APK
        run: gradle --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xttmbmm77sa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
