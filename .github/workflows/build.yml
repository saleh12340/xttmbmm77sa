name: Build Azizi Grocery Android App (APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Run Type Check & Verification
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Azizi-POS-Grocery.apk

      - name: Upload Android APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azizi-POS-Grocery-APK
          path: build-artifacts/Azizi-POS-Grocery.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release for Mobile Direct Download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "أحدث إصدار - تطبيق بقالة العزي (APK)"
          body: |
            📱 **تطبيق بقالة العزي للمواد الغذائية - للأندرويد**
            
            يمكنك تحميل ملف الـ APK وتثبيته مباشرة على جوالك من قسم الأصول (Assets) أدناه بالضغط على:
            👉 **Azizi-POS-Grocery.apk**
          files: build-artifacts/Azizi-POS-Grocery.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

