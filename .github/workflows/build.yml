name: Build Azizi Grocery Android App (APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Force a fresh workflow run after Android build configuration fixes.
  AZIZI_ANDROID_BUILD_CONFIG: "minSdk24"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Type Check & Verification
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android Build Environment
        run: |
          node --version
          java -version
          gradle --version

      # Build inside android/ so Gradle loads the Android project's own settings file.
      - name: Build Android Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Azizi-POS-Grocery.apk

      - name: Upload Android APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azizi-POS-Grocery-APK
          path: build-artifacts/Azizi-POS-Grocery.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release for Mobile Direct Download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "أحدث إصدار - تطبيق بقالة العزي (APK)"
          body: |
            📱 **تطبيق بقالة العزي للمواد الغذائية - للأندرويد**

            ملف APK مبني تلقائياً من الفرع الرئيسي.
          files: build-artifacts/Azizi-POS-Grocery.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
